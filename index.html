<!doctype html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AntunesPlayer</title>
<meta name="theme-color" content="#070b17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
<div id="app">
  <header id="top">
    <button class="ib" id="bBack" aria-label="Back"></button>
    <div class="logo" id="logo">Antunes<span>Player</span></div>
    <h1 id="title"></h1>
    <label class="search" id="qWrap"><span class="si"></span><input id="q" type="search" autocomplete="off" placeholder="Search"></label>
    <div class="clock" id="clock"><b></b><small></small></div>
    <div class="acts">
      <button class="ib" id="bSearch" aria-label="Search"></button>
      <button class="ib" id="bGuide" aria-label="TV guide"></button>
      <button class="ib" id="bSet" aria-label="Settings"></button>
    </div>
  </header>

  <main id="vHome" class="view"></main>

  <main id="vBrowse" class="view">
    <nav id="groups" aria-label="Categories"></nav>
    <button id="catBtn" class="catbtn"></button>
    <section id="list" aria-label="List"></section>
    <aside id="side"><div id="slot"></div><div id="info"></div></aside>
  </main>

  <main id="vDetail" class="view"></main>
  <main id="vSearch" class="view"><section id="sres"></section></main>
</div>

<div id="screen" class="pv">
  <video id="v" playsinline></video>
  <div id="spin" hidden></div>
  <div id="num" hidden></div>
  <button id="pExpand" aria-label="Full screen"></button>
  <div id="ov">
    <div id="ovTop">
      <button class="ob" id="cExit" aria-label="Back"></button>
      <div id="osd"><b id="osdN"></b><div><strong id="osdT"></strong><span id="osdS"></span></div></div>
      <time id="ovClock"></time>
    </div>
    <button id="bigPlay" aria-label="Play/Pause"></button>
    <div id="ovBot">
      <div id="seekrow"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="tDur">0:00</span></div>
      <div id="liveBar"><span id="lbNow"></span><div class="lpb"><i id="lbPb"></i></div><span id="lbNext"></span></div>
      <div id="btns">
        <button class="ob vo" id="cBack" aria-label="-10s"></button>
        <button class="ob vo" id="cPlay" aria-label="Play/Pause"></button>
        <button class="ob vo" id="cFwd" aria-label="+10s"></button>
        <button class="ob lo" id="cPrev" aria-label="Previous channel"></button>
        <button class="ob lo" id="cList" aria-label="Channel list"></button>
        <button class="ob lo" id="cNext" aria-label="Next channel"></button>
        <span class="gap"></span>
        <button class="ob" id="cFav" aria-label="Favourite"></button>
        <button class="ob" id="cTrk" aria-label="Audio / subtitles"></button>
        <button class="ob" id="cAsp" aria-label="Picture size"></button>
        <button class="ob" id="cPip" aria-label="Picture in picture"></button>
        <button class="ob lo" id="cRec" aria-label="Record"></button>
        <button class="ob" id="cMute" aria-label="Mute"></button>
      </div>
    </div>
  </div>
  <div id="msg" hidden></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
