<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AntunesPlayer</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">Antunes<span>Player</span></div>
    <select id="src" aria-label="Playlist"></select>
    <input id="q" type="search" placeholder="Search channels, movies, series…" aria-label="Search">
    <button class="ib" id="bGuide" title="TV guide" aria-label="TV guide">▦</button>
    <button class="ib" id="bAdd" title="Add playlist">＋</button>
    <button class="ib" id="bSet" title="Settings">⚙</button>
  </header>
  <main id="main">
    <nav id="groups" aria-label="Groups"></nav>
    <section id="list" aria-label="Channels"></section>
    <section id="stage">
      <div id="screen">
        <video id="v" playsinline></video>
        <div id="osd" hidden><b id="osdN"></b><div><strong id="osdT"></strong><span id="osdS"></span></div></div>
        <div id="num" hidden></div>
        <div id="msg" hidden></div>
        <div id="spin" hidden></div>
        <div id="ctl">
          <div id="seekrow"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="tDur">0:00</span></div>
          <div id="btns">
          <button id="cBack" class="vo" title="-10s (←)">⏪</button>
          <button id="cPlay" class="vo" title="Play/Pause (Space)">⏸</button>
          <button id="cFwd" class="vo" title="+10s (→)">⏩</button>
          <button id="cFav" title="Favourite (F)">☆</button>
          <button id="cPrev" title="Previous (↓)">⏮</button>
          <button id="cNext" title="Next (↑)">⏭</button>
          <button id="cMute" title="Mute (M)">🔊</button>
          <button id="cRec" title="Record (R)">⏺</button>
          <button id="cList" title="Channels (Enter)">☰</button>
          <button id="cTrk" title="Audio / subtitles">🎧</button>
          <button id="cAsp" title="Picture size">▭</button>
          <button id="cPip" title="Picture in picture">❐</button>
          <button id="cFs" title="Full screen">⛶</button>
          </div>
        </div>
      </div>
      <div id="info"></div>
    </section>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
