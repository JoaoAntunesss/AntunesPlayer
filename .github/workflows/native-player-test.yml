name: Test native player (Android emulator)
# Builds the release APK (with the page reachable by Chrome DevTools), starts an Android emulator and, in the real app,
# plays test films with AC3, DTS and E-AC3 sound and subtitles (scripts/native-player-test.sh, scripts/native-e2e.mjs).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/android_patch.py', 'scripts/native-*', 'src/**', '.github/workflows/native-player-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node scripts/prepare-www.mjs
      - run: npx cap add android
      - run: pip install pillow && NATIVE_TEST=1 python scripts/android_patch.py
      - run: npx cap sync android
      - name: Let the test reach the app's page (test build only)
        run: |
          python3 - <<'PY'
          import json
          p = 'android/app/src/main/assets/capacitor.config.json'
          c = json.load(open(p)); c.setdefault('android', {})['webContentsDebuggingEnabled'] = True
          json.dump(c, open(p, 'w'))
          PY
      - run: mkdir -p ~/.android && cp android-res/debug.keystore ~/.android/debug.keystore
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Test videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install pillow -q
          mkdir media && cd media
          printf '1\n00:00:01,000 --> 00:00:40,000\nLegenda de teste\n' > s.srt
          for a in ac3 eac3 dca aac; do
            ffmpeg -loglevel error -y -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i "sine=f=440:sample_rate=48000" -i s.srt \
              -t 40 -map 0 -map 1 -map 2 -c:v libx264 -pix_fmt yuv420p -c:a $a -strict -2 -ac 2 -c:s srt test-$a.mkv
          done
          ls -la
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Play them on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/native-player-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-player-test, path: out/ }
