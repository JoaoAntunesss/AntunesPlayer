name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Stamp build number
        run: echo "window.AP_BUILD = ${{ github.run_number }};" > js/build.js
      - run: node scripts/prepare-www.mjs
      - run: npx cap add android
      - run: pip install pillow && python scripts/android_patch.py
      - run: npx cap sync android
      - name: Fixed signing key (so new versions install over old ones)
        run: mkdir -p ~/.android && cp android-res/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AntunesPlayer.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AntunesPlayer.apk --clobber
            gh release edit latest --title "AntunesPlayer build ${{ github.run_number }}" --prerelease
          else
            gh release create latest AntunesPlayer.apk --prerelease --title "AntunesPlayer build ${{ github.run_number }}" --notes "Android / Android TV app. Install the APK (allow installs from this source). Updates replace the previous version."
          fi
      - uses: actions/upload-artifact@v4
        with: { name: AntunesPlayer-apk, path: AntunesPlayer.apk }
